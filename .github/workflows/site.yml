# Builds and checks both sites on every pull request and push, without AWS access. On a push
# to main, deploys the checked build with the GitHub OIDC deploy role.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), from the
# stack's outputs: DEPLOY_ROLE_ARN, BUCKET_NAME, DISTRIBUTION_ID. The deploy job skips until
# DEPLOY_ROLE_ARN is set.
#
# The product sync (product-sync.yml) starts this workflow itself, on its branch and then on
# main: what its token does starts no workflow.
#
# Every action is pinned to a full commit SHA; the comment names its release.

name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The product sync's branch merges by itself, so there a diagram Mermaid cannot parse, a
      # docs link or anchor that does not resolve, or a spec link to no page fails the check.
      DOCS_STRICT: ${{ (github.ref_name == 'product-sync' || github.head_ref == 'product-sync') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browsers (Mermaid rendering and the browser check)
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Unit tests (stack, CloudFront Functions, build scripts; fetches the product first)
        run: pnpm test

      - name: Build both sites
        run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          # The docs' Platforms page hotlinks logos from Brandfetch with it; without it, initials.
          BRANDFETCH_CLIENT_ID: ${{ vars.BRANDFETCH_CLIENT_ID }}

      - name: Typecheck (the stack, and both apps against the types the build generated)
        run: pnpm typecheck

      - name: Check the built HTML (no inline code, no third parties, links resolve)
        run: pnpm check:html

      - name: Check in Chromium and WebKit under the production headers
        run: pnpm test:browser

      - name: Keep the build for the deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No `environment:` here: the deploy role trusts the token subject of main itself
    # (repo:...:ref:refs/heads/main); a job with an environment presents a different one.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No install scripts in the job that later holds AWS credentials; the deploy needs only
      # the AWS SDK's JavaScript.
      - name: Install dependencies (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out/

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          role-session-name: website-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Upload, delete what is gone, invalidate
        run: node scripts/deploy.mjs
        env:
          BUCKET: ${{ vars.BUCKET_NAME }}
          DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
